[project]
name = "skillguard"
version = "0.1.0"
description = "Scan skills, plugins and repos for security red flags before installing"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"

[project.scripts]
skillguard = "skillguard:main_cli"

[tool.setuptools]
py-modules = ["skillguard"]
